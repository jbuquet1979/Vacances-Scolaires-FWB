name: HACS Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate HACS with Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          